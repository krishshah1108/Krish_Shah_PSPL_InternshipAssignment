# Hits /api/health twice daily so free-tier Supabase sees DB activity (health runs SELECT 1).
name: Keep database awake

on:
  schedule:
    # 00:00 and 12:00 UTC (~5:30 and 17:30 IST)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping /api/health (API + DB)
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://krish-shah-pspl-internshipassignment.onrender.com/api/health}"
          echo "Pinging $URL"
          curl -sS --max-time 120 -w "\nHTTP %{http_code}\n" "$URL" || echo "Ping failed (Render/Supabase may still be waking up)"
